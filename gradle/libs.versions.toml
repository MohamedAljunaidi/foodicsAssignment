[versions]
kotlinGradlePlugin = "2.1.21"
coreKtx = "1.16.0"
junit = "4.13.2"
espressoCore = "3.6.1"
lifecycleRuntimeKtx = "2.9.1"
activityCompose = "1.10.1"
androidxComposeBom = "2025.06.00"
